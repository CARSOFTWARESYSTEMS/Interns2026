<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Link-preview tags, for crawlers that never run JavaScript. index.html has the
         neutral ones (unknown hosts); the build writes index.<partnerId>.html with each
         Partner's, and vercel.json serves that copy on the Partner's login domains
         (src/tenant/socialMeta.ts). src/tenant/theme.ts still sets the title, favicon
         and theme colour at runtime. -->
    <!-- social-meta:start -->
    <title>Engineering Command Center</title>
    <meta name="description" content="Engineering command center for engineering teams, intern programs, QA workflows, and mission-ready evidence." />
    <meta name="application-name" content="Engineering Command Center" />
    <meta name="apple-mobile-web-app-title" content="Engineering Command Center" />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#0f172a" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Engineering Command Center" />
    <meta property="og:title" content="Engineering Command Center" />
    <meta property="og:description" content="Engineering command center for engineering teams, intern programs, QA workflows, and mission-ready evidence." />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Engineering Command Center" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Engineering Command Center" />
    <meta name="twitter:description" content="Engineering command center for engineering teams, intern programs, QA workflows, and mission-ready evidence." />
    <meta name="twitter:image" content="/og-image.png" />
    <meta name="twitter:image:alt" content="Engineering Command Center" />
    <!-- social-meta:end -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  </head>
  <body class="bg-slate-50 text-slate-900">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
